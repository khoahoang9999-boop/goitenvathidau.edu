    <script>
      (function() {
        // Fix for "Cannot set property fetch of #<Window> which has only a getter"
        try {
          let currentFetch = window.fetch;
          const desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                       Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && !desc.set) {
            Object.defineProperty(window, 'fetch', {
              get() { return currentFetch; },
              set(fn) { currentFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}

        try {
          const origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if ((obj === window || (typeof Window !== 'undefined' && obj === Window.prototype)) &&
                prop === 'fetch' && descriptor && descriptor.get && !descriptor.set) {
              let customVal;
              const origGet = descriptor.get;
              descriptor.get = function() {
                return customVal !== undefined ? customVal : origGet.call(this);
              };
              descriptor.set = function(val) {
                customVal = val;
              };
            }
            return origDefineProperty.apply(this, arguments);
          };
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if ((event.message && event.message.includes('fetch') && event.message.includes('getter')) ||
              (event.error && event.error.message && event.error.message.includes('fetch') && event.error.message.includes('getter'))) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
